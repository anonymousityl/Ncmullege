<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#585858">
<title>Mustafa Awol</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light;--ink:#0b0b0d;--muted:#7d8189;--line:#ececf0;--chip:#f2f2f4;
 --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.page{max-width:480px;margin:0 auto;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.top{position:relative}
.hero{text-align:center;padding:calc(11px + env(safe-area-inset-top,0px)) 16px 0;min-height:calc(288px + env(safe-area-inset-top,0px));
 background:linear-gradient(180deg,#575757 0%,#8c8c8c 45%,#e6e7ec 100%);
 clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),0 100%)}
.avatar{display:block;margin:0 auto;width:120px;height:120px;border-radius:50%;border:7px solid #fff;object-fit:cover;background:#bcd3e8}
h1{margin:25px 0 0;font-weight:600;font-size:23px;line-height:30px}
.role{margin:13px auto 0;font-size:17px;line-height:24px;text-wrap:balance}
.fab{position:absolute;left:50%;bottom:-31px;transform:translateX(-50%);width:62px;height:62px;border-radius:50%;background:#fff;
 display:grid;place-items:center;color:var(--ink);box-shadow:0 6px 24px rgba(0,0,0,.08)}
.fab svg{width:22px;height:22px}
.card{margin:56px 16px 0;padding:0 20px;background:#fff;border-radius:8px;box-shadow:0 2px 20px rgba(0,0,0,.05)}
.row{display:flex;align-items:center;gap:16px;padding:18px 0;color:inherit;text-decoration:none}
.row+.row{border-top:1px solid var(--line)}
.ic{flex:none;width:40px;height:40px;border-radius:50%;background:var(--chip);color:#6b6f77;display:grid;place-items:center}
.ic svg{width:22px;height:22px}
svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tx{min-width:0}
.tx small{display:block;font-size:14px;line-height:18px;color:var(--muted)}
.tx span{display:block;font-size:18px;line-height:24px;overflow-wrap:anywhere}
.add{display:flex;align-items:center;justify-content:center;gap:12px;width:calc(100% - 32px);height:56px;margin:20px 16px 0;border:0;border-radius:8px;
 background:#ebecf0;color:var(--ink);font:500 18.5px var(--sans);cursor:pointer}
.add svg{width:24px;height:24px}
a:focus-visible,button:focus-visible{outline:3px solid #3b6fd4;outline-offset:3px}
.add:active,.row:active{opacity:.7}
</style>
</head>

  function fold(s) {
    var o = [s.slice(0, 75)]; s = s.slice(75);
    while (s.length > 74) { o.push(" " + s.slice(0, 74)); s = s.slice(74); }
    if (s) o.push(" " + s);
    return o.join("\r\n");
  }
  function build() {
    var L = ["BEGIN:VCARD", "VERSION:3.0",
      "N:" + C.last + ";" + C.first + ";;;", "FN:" + C.first + " " + C.last,
      "ORG:" + C.org, "TITLE:" + C.title, "EMAIL;TYPE=WORK:" + C.email];
    C.urls.forEach(function (u) { L.push("URL:" + u); });
    if (C.photo) L.push("PHOTO;ENCODING=b;TYPE=JPEG:" + C.photo);
    L.push("END:VCARD");
    return L.map(fold).join("\r\n") + "\r\n";
  }
  document.getElementById("save").addEventListener("click", function () {
    var blob = new Blob([build()], { type: "text/vcard;charset=utf-8" });
    var url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = C.first + "-" + C.last + ".vcf";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  });
})();
